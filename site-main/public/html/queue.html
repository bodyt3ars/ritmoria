<div class="queue-page">
  <div class="queue-section-nav" aria-label="Разделы очереди" data-i18n-aria-label="queue.sections">
    <button type="button" class="queue-section-nav-btn is-active" onclick="navigate('/queue')" data-i18n="queue.queue">Очередь</button>
    <button type="button" class="queue-section-nav-btn" onclick="navigate('/queue/battles')" data-i18n="queue.battles">Баттлы</button>
  </div>

  <div class="queue-header">
    <h1 class="queue-title" data-i18n="queue.title">Очередь треков</h1>
    <div id="queueStatusText" class="queue-status" data-i18n="queue.loading">загрузка...</div>
  </div>

  <div id="adminControls" class="queue-admin queue-hidden">
    <button id="openQueue" class="queue-admin-btn" data-i18n="queue.open">Открыть</button>
    <button id="pauseQueue" class="queue-admin-btn" data-i18n="queue.pause">Пауза</button>
    <button id="resumeQueue" class="queue-admin-btn" data-i18n="queue.resume">Возобновить</button>
    <button id="closeQueue" class="queue-admin-btn queue-admin-btn-danger" data-i18n="queue.close">Закрыть</button>
  </div>

  <div id="queueRatingControls" class="queue-rating-controls queue-hidden" aria-label="Переключатель рейтинга">
    <button type="button" class="queue-rating-tab is-active" data-rating-view="total" data-i18n="queue.totalTab">Общие</button>
    <button type="button" class="queue-rating-tab" data-rating-view="judge" data-i18n="queue.judgesTab">Судьи</button>
    <button type="button" class="queue-rating-tab" data-rating-view="user" data-i18n="queue.usersTab">Пользователи</button>
  </div>

  <div id="queueList" class="queue-list"></div>
</div>
