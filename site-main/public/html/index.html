<div class="home-page">
  <h1 class="home-seo-only" data-i18n="home.seoTitle">Ритмория — музыкальная платформа для артистов, треков, опенов и стримов</h1>
  <div class="home-layout">
    <aside id="homeTopTracksPanel" class="home-left-panel home-collapsible-panel">
      <button
        id="homeTopTracksToggle"
        class="home-panel-toggle home-panel-title home-panel-title-decorated"
        type="button"
        aria-expanded="false"
        aria-controls="homeTopTracks"
      >
        <span data-i18n="home.topTracks">Лучшие треки прошлого стрима</span>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div id="homeTopTracks" class="home-side-list">
        <div class="home-loading-card" data-i18n="home.loadingTracks">Загрузка треков...</div>
      </div>
    </aside>

    <main class="home-feed">
      <section id="homeNewsBlock" class="home-news-block">
        <div class="home-news-header">
          <h2 class="home-feed-title home-panel-title-decorated" data-i18n="home.news">Новости</h2>
        </div>
        <div id="homeNewsList" class="home-news-list">
          <div class="home-loading-card" data-i18n="home.loadingNews">Загрузка новостей...</div>
        </div>
      </section>

      <section class="home-spotlight-block">
        <div class="home-feed-header home-feed-header-compact">
          <h2 class="home-feed-title home-panel-title-decorated" data-i18n="home.discoverTracks">Открывай треки</h2>
        </div>
        <div class="home-spotlight-shell">
          <button
            type="button"
            class="home-spotlight-arrow home-spotlight-arrow-prev"
            id="homeSpotlightPrev"
            aria-label="Показать предыдущие треки"
            data-i18n-aria-label="home.prevTracks"
          >
            <i class="fa-solid fa-chevron-left"></i>
          </button>

          <div id="homeSpotlightTracks" class="home-spotlight-row">
            <div class="home-loading-card" data-i18n="home.loadingSpotlight">Загрузка подборки...</div>
          </div>

          <button
            type="button"
            class="home-spotlight-arrow home-spotlight-arrow-next"
            id="homeSpotlightNext"
            aria-label="Показать следующие треки"
            data-i18n-aria-label="home.nextTracks"
          >
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </section>

      <section class="profile-page home-posts-shell">
        <div class="home-feed-header">
          <h2 class="home-feed-title home-panel-title-decorated" data-i18n="home.recommendations">Рекомендации</h2>
        </div>
        <div id="homeFeedPosts" class="home-feed-list">
          <div class="home-loading-card" data-i18n="home.loadingPosts">Загрузка постов...</div>
        </div>
        <button type="button" id="homeRecommendationsMore" class="home-recommendations-more" hidden>
          <i class="fa-solid fa-chevron-down"></i>
          <span data-i18n="home.moreRecommendations">Ещё рекомендации</span>
        </button>
      </section>
    </main>

    <aside class="home-right-panel">
      <h2 class="home-panel-title home-panel-title-decorated" data-i18n="home.artistTop">Топ исполнители</h2>
      <div id="homeTopArtists" class="home-side-list">
        <div class="home-loading-card">Загрузка артистов...</div>
      </div>
    </aside>

  </div>
</div>
